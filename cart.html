<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Cart | LUXEWEAR</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- NAVBAR -->

    <header class="navbar">

        <div class="logo">
            LUXEWEAR
        </div>

        <nav>

            <a href="home.html">Home</a>
            <a href="products.html">Shop</a>
            <a href="#">Women</a>
            <a href="#">Men</a>
            <a href="#">New Arrivals</a>
            <a href="#">About</a>
            <a href="#">Contact</a>

        </nav>

        <div class="icons">

            <span>⌕</span>
            <span>♡</span>

            <a href="cart.html" class="cart-icon">
                🛒
            </a>

        </div>

    </header>


    <!-- CART HEADER -->

    <section class="cart-header">

        <p>YOUR SHOPPING BAG</p>

        <h1>MY CART</h1>

    </section>


    <!-- CART -->

    <section class="cart-section">

        <div id="cartItems">

            <!-- Products will appear here -->

        </div>


        <div class="cart-summary">

            <h2>ORDER SUMMARY</h2>

            <div class="summary-row">

                <span>Subtotal</span>

                <span id="cartTotal">
                    ₹0
                </span>

            </div>

            <div class="summary-row">

                <span>Delivery</span>

                <span>FREE</span>

            </div>

            <hr>

            <div class="total-row">

                <span>Total</span>

                <span id="finalTotal">
                    ₹0
                </span>

            </div>
               <a href="checkout.html" class="checkout-btn">
                  PROCEED TO CHECKOUT
               </a>

        </div>

    </section>


    <!-- FOOTER -->

    <footer>

        <div class="footer-logo">
            LUXEWEAR
        </div>

        <p>
            © 2026 LUXEWEAR. All Rights Reserved.
        </p>

    </footer>


<script src="script.js"></script>
</body>

</html>
