<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login | LUXEWEAR</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- NAVBAR -->

    <header class="navbar">

        <div class="logo">
            LUXEWEAR
        </div>

        <nav>

            <a href="home.html">Home</a>
            <a href="products.html">Shop</a>
            <a href="#">Women</a>
            <a href="#">Men</a>
            <a href="#">New Arrivals</a>
            <a href="#">About</a>
            <a href="#">Contact</a>

        </nav>

        <div class="icons">

            <span>⌕</span>
            <span>♡</span>

            <a href="cart.html" class="cart-icon">
                🛒
            </a>

        </div>

    </header>


    <!-- LOGIN -->

    <section class="login-page">

        <div class="login-box">

            <p class="login-small">
                WELCOME BACK
            </p>

            <h1>LOGIN</h1>

            <p class="login-text">
                Sign in to continue shopping with LUXEWEAR.
            </p>


        <form id="loginForm">
                <div class="login-field">

                    <label>Email Address</label>

                    <input
                        type="email"
                        placeholder="Enter your email"
                        required>

                </div>


                <div class="login-field">

                    <label>Password</label>

                    <input
                        type="password"
                        placeholder="Enter your password"
                        required>

                </div>


                <div class="login-options">

                    <label>

                        <input type="checkbox">

                        Remember me

                    </label>

                    <a href="#">
                        Forgot Password?
                    </a>

                </div>


                <button
                    type="submit"
                    class="login-btn">

                    LOGIN

                </button>

            </form>


            <p class="signup-text">

                Don't have an account?

                <a href="signup.html">
                  Create Account
                </a>

            </p>

        </div>

    </section>


    <!-- FOOTER -->

    <footer>

        <div class="footer-logo">
            LUXEWEAR
        </div>

        <p>
            © 2026 LUXEWEAR. All Rights Reserved.
        </p>

    </footer>
<script src="script.js"></script>
</body>

</html>
