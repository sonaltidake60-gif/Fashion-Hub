<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Checkout | LUXEWEAR</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- NAVBAR -->

    <header class="navbar">

        <div class="logo">
            LUXEWEAR
        </div>

        <nav>

            <a href="home.html">Home</a>
            <a href="products.html">Shop</a>
            <a href="#">Women</a>
            <a href="#">Men</a>
            <a href="#">New Arrivals</a>
            <a href="#">About</a>
            <a href="#">Contact</a>

        </nav>

        <div class="icons">

            <span>⌕</span>
            <span>♡</span>

            <a href="cart.html" class="cart-icon">
                🛒
            </a>

        </div>

    </header>


    <!-- CHECKOUT HEADER -->

    <section class="checkout-header">

        <p>COMPLETE YOUR ORDER</p>

        <h1>CHECKOUT</h1>

    </section>


    <!-- CHECKOUT -->

    <section class="checkout-section">

        <!-- CUSTOMER DETAILS -->

        <div class="customer-details">

            <h2>DELIVERY INFORMATION</h2>

            <div class="form-row">

                <div class="form-group">

                    <label>First Name</label>

                    <input
                        type="text"
                        placeholder="Enter first name">

                </div>


                <div class="form-group">

                    <label>Last Name</label>

                    <input
                        type="text"
                        placeholder="Enter last name">

                </div>

            </div>


            <div class="form-group">

                <label>Email Address</label>

                <input
                    type="email"
                    placeholder="Enter email address">

            </div>


            <div class="form-group">

                <label>Mobile Number</label>

                <input
                    type="tel"
                    placeholder="Enter mobile number">

            </div>


            <div class="form-group">

                <label>Address</label>

                <textarea
                    placeholder="Enter your complete address">
                </textarea>

            </div>


            <div class="form-row">

                <div class="form-group">

                    <label>City</label>

                    <input
                        type="text"
                        placeholder="City">

                </div>


                <div class="form-group">

                    <label>PIN Code</label>

                    <input
                        type="text"
                        placeholder="PIN Code">

                </div>

            </div>


            <!-- PAYMENT -->

            <h2 class="payment-title">
                PAYMENT METHOD
            </h2>


            <div class="payment-option">

                <input
                    type="radio"
                    name="payment"
                    checked>

                <label>
                    Cash on Delivery
                </label>

            </div>


            <div class="payment-option">

                <input
                    type="radio"
                    name="payment">

                <label>
                    UPI / Online Payment
                </label>

            </div>


            <div class="payment-option">

                <input
                    type="radio"
                    name="payment">

                <label>
                    Credit / Debit Card
                </label>

            </div>

        </div>


        <!-- ORDER SUMMARY -->

        <div class="checkout-summary">

            <h2>YOUR ORDER</h2>

            <div id="checkoutItems">

                <!-- Products will appear here -->

            </div>


            <hr>


            <div class="checkout-total">

                <span>Total</span>

                <span id="checkoutTotal">
                    ₹0
                </span>

            </div>


            <button
                class="place-order-btn"
                onclick="placeOrder()">

                PLACE ORDER

            </button>

        </div>

    </section>


    <!-- FOOTER -->

    <footer>

        <div class="footer-logo">
            LUXEWEAR
        </div>

        <p>
            © 2026 LUXEWEAR. All Rights Reserved.
        </p>

    </footer>


    <script src="script.js"></script>

</body>

</html>
